name: Deploy Dillinger (per-branch tenant)

# Gives every branch its own persistent Lambda tenant, separate from the
# "staging" tenant that deploy-lambda.yml owns for main. Unlike
# tenant-lifecycle.yml (which always deprovisions at the end, even on
# failure), the tenant this workflow creates is NOT torn down
# automatically - it's meant to stay up for the life of the branch, the
# same way "staging" stays up for main. Clean it up manually when the
# branch is done:
#   infra/deprovision-tenant.sh <tenant-id> <region> --yes
#
# Tenant id is always derived from the branch name
# (branch-<ref-name>, lowercased, non [a-z0-9-] chars collapsed to '-')
# so re-pushing to the same branch updates that same tenant instead of
# creating a new one each time.
#
# Trigger: push, deliberately NOT workflow_dispatch. GitHub only lets you
# workflow_dispatch a workflow that's already registered on the default
# branch (main) - this workflow exists to let *other* branches deploy
# their own tenant without ever touching main, so workflow_dispatch
# would defeat the point. push-triggered workflows have no such
# requirement: GitHub evaluates the workflow file as it exists on the
# branch that received the push, independent of main.
#
# Scope is a deliberate, explicit allowlist (`branches:`), not "every
# branch except main" - every push to a listed branch triggers a real
# `sam deploy` against real AWS infra, so this is opt-in per branch, not
# a standing repo-wide policy. main is deliberately absent from this
# list: it's handled by deploy-lambda.yml's separate, existing
# "staging" tenant, unchanged by this workflow. To give another branch
# its own persistent tenant, add its exact name to the `branches:` list
# below.
#
# There is no automatic teardown when a listed branch is deleted or
# retired - see the cleanup command above; remove the branch from this
# list too so it stops redeploying.
#
# Auth: GitHub OIDC assuming an IAM role (see spec/07-execution-cicd.md)
# - no long-lived AWS access keys stored in GitHub. Same OIDC trust
# policy as deploy-lambda.yml / tenant-lifecycle.yml, which is why the
# job below still runs in the "staging" GitHub *Environment* even though
# the AWS tenant it deploys is not named "staging" - that Environment
# name is fixed by infra/bootstrap/ci-trust-policy.template.json's
# subject pin, unrelated to the tenant id chosen here.
on:
  push:
    branches:
      # Explicit allowlist - add a branch name here to give it its own
      # persistent tenant on push. main is intentionally not listed;
      # deploy-lambda.yml owns main's "staging" tenant separately.
      - claude/modern-dillinger-aws

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  provider:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.provider.outputs.active }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read active CI provider
        id: provider
        run: scripts/ci-provider.sh github-output

  security:
    needs: provider
    if: needs.provider.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dillinger-sbom-branch-tenant
          path: sbom.cdx.json
          if-no-files-found: error

  deploy:
    needs: [provider, security]
    if: needs.provider.outputs.active == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: dillinger-branch-tenant-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tenant id
        id: tenant
        run: |
          set -euo pipefail
          RAW="branch-${GITHUB_REF_NAME}"
          SANITIZED=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//')
          TENANT_ID="${SANITIZED:0:40}"
          if [[ "$TENANT_ID" == "staging" ]]; then
            echo "Refusing to deploy the per-branch workflow against the staging tenant - that's deploy-lambda.yml's job (main only)." >&2
            exit 1
          fi
          if ! [[ "$TENANT_ID" =~ ^[a-z0-9-]+$ ]]; then
            echo "Resolved tenant id '${TENANT_ID}' does not match [a-z0-9-]+ - fix the branch name." >&2
            exit 1
          fi
          echo "id=${TENANT_ID}" >> "$GITHUB_OUTPUT"
          echo "Resolved tenant: ${TENANT_ID} (branch: ${GITHUB_REF_NAME})"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python (for AWS SAM CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Deploy branch tenant
        # MaxTenantConcurrency=0: this account's Lambda concurrency quota
        # has zero headroom left for another reservation once staging's
        # own reservation is accounted for (confirmed - even a 1-unit
        # reservation hit AWS's mandatory 10-unit unreserved floor). 0
        # skips ReservedConcurrentExecutions entirely, so this tenant
        # draws from the account's shared unreserved pool instead. That's
        # the right tradeoff for a dev-stage branch tenant, which doesn't
        # need a hard per-tenant concurrency cap - see ARCHITECTURE.md's
        # "Reserved concurrency and the microVM pool" section. Revisit if
        # this account's quota is raised or this tenant needs isolation
        # guarantees again.
        run: infra/provision-tenant.sh "${{ steps.tenant.outputs.id }}" "${AWS_REGION}" 0

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          TENANT_ID="${{ steps.tenant.outputs.id }}"
          FUNCTION_URL=$(python3 -c "
          import json
          data = json.load(open('infra/tenants.json'))
          tenant = next(t for t in data['tenants'] if t['tenantId'] == '${TENANT_ID}')
          print(tenant['functionUrl'])
          ")
          status=$(curl -s -o /dev/null -w "%{http_code}" "$FUNCTION_URL")
          echo "Tenant '${TENANT_ID}' responded with HTTP $status at ${FUNCTION_URL}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Smoke test failed" >&2
            exit 1
          fi
          echo "function_url=${FUNCTION_URL}" >> "$GITHUB_OUTPUT"
          echo "http_status=${status}" >> "$GITHUB_OUTPUT"

      # Makes the deployed URL something an engineer can actually find and
      # check, not just a fact buried in step logs: a Job Summary entry
      # visible directly on the run page, plus a downloadable JSON artifact
      # with enough detail (commit, smoke-test result, timestamp) to verify
      # which code is live without re-running anything.
      - name: Publish deployment URL artifact
        id: publish
        run: |
          set -euo pipefail
          TENANT_ID="${{ steps.tenant.outputs.id }}"
          FUNCTION_URL="${{ steps.smoke.outputs.function_url }}"
          HTTP_STATUS="${{ steps.smoke.outputs.http_status }}"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          mkdir -p artifact
          cat > artifact/deployment-info.json <<JSON
          {
            "tenantId": "${TENANT_ID}",
            "functionUrl": "${FUNCTION_URL}",
            "region": "${AWS_REGION}",
            "smokeTestHttpStatus": "${HTTP_STATUS}",
            "commitSha": "${{ github.sha }}",
            "branch": "${GITHUB_REF_NAME}",
            "deployedAt": "${DEPLOYED_AT}",
            "workflowRunUrl": "${RUN_URL}"
          }
          JSON
          cat artifact/deployment-info.json

          {
            echo "## Deployment: \`${TENANT_ID}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Function URL | ${FUNCTION_URL} |"
            echo "| Smoke test | HTTP ${HTTP_STATUS} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployed at (UTC) | ${DEPLOYED_AT} |"
            echo ""
            echo "Verify independently: \`curl -I ${FUNCTION_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ steps.tenant.outputs.id }}
          path: artifact/deployment-info.json
          if-no-files-found: error

      - name: Commit updated tenant registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/tenants.json
          git diff --cached --quiet || git commit -m "Update tenant registry: ${{ steps.tenant.outputs.id }} [skip ci]"
          # Push back to the branch that triggered this run - never
          # hardcode a branch name here.
          git push origin "HEAD:${GITHUB_REF_NAME}"
