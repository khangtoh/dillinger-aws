name: Deploy Dillinger (staging tenant)

# Verifies the build+deploy pipeline against a fixed "staging" tenant.
# Real user tenants are provisioned manually via infra/provision-tenant.sh
# (see spec/09-multi-tenancy.md) - CI does not auto-provision new tenants,
# only keeps the one staging instance current so the pipeline itself is
# proven working.
#
# Auth: GitHub OIDC assuming an IAM role (see spec/07-execution-cicd.md)
# - no long-lived AWS access keys stored in GitHub.
#
# Trigger is intentionally manual-only (workflow_dispatch) for now: this
# job runs real `sam deploy` calls against real AWS infra, and nobody has
# confirmed yet whether pushes to main should trigger that automatically
# with no approval step. Once that's decided, either:
#   - switch to `on: push: branches: [main]` for fully automatic deploys, or
#   - keep push-triggered but add a `environment: production` block on the
#     `deploy` job referencing a GitHub Environment with required reviewers,
#     for a manual-approval gate before each deploy.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STAGING_TENANT_ID: staging

jobs:
  provider:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.provider.outputs.active }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read active CI provider
        id: provider
        run: scripts/ci-provider.sh github-output

  security:
    needs: provider
    if: needs.provider.outputs.active == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: dillinger-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  deploy:
    needs: [provider, security]
    if: github.ref == 'refs/heads/main' && needs.provider.outputs.active == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: dillinger-staging-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python (for AWS SAM CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Deploy staging tenant
        run: infra/provision-tenant.sh "${STAGING_TENANT_ID}" "${AWS_REGION}"

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          FUNCTION_URL=$(python3 -c "
          import json
          data = json.load(open('infra/tenants.json'))
          tenant = next(t for t in data['tenants'] if t['tenantId'] == '${STAGING_TENANT_ID}')
          print(tenant['functionUrl'])
          ")
          status=$(curl -s -o /dev/null -w "%{http_code}" "$FUNCTION_URL")
          echo "Staging tenant responded with HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Smoke test failed" >&2
            exit 1
          fi
          echo "function_url=${FUNCTION_URL}" >> "$GITHUB_OUTPUT"
          echo "http_status=${status}" >> "$GITHUB_OUTPUT"

      # Makes the deployed URL something an engineer can actually find and
      # check, not just a fact buried in step logs: a Job Summary entry
      # visible directly on the run page, plus a downloadable JSON artifact
      # with enough detail (commit, smoke-test result, timestamp) to verify
      # which code is live without re-running anything.
      - name: Publish deployment URL artifact
        run: |
          set -euo pipefail
          FUNCTION_URL="${{ steps.smoke.outputs.function_url }}"
          HTTP_STATUS="${{ steps.smoke.outputs.http_status }}"
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          mkdir -p artifact
          cat > artifact/deployment-info.json <<JSON
          {
            "tenantId": "${STAGING_TENANT_ID}",
            "functionUrl": "${FUNCTION_URL}",
            "region": "${AWS_REGION}",
            "smokeTestHttpStatus": "${HTTP_STATUS}",
            "commitSha": "${{ github.sha }}",
            "branch": "${GITHUB_REF_NAME}",
            "deployedAt": "${DEPLOYED_AT}",
            "workflowRunUrl": "${RUN_URL}"
          }
          JSON
          cat artifact/deployment-info.json

          {
            echo "## Deployment: \`${STAGING_TENANT_ID}\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Function URL | ${FUNCTION_URL} |"
            echo "| Smoke test | HTTP ${HTTP_STATUS} |"
            echo "| Region | ${AWS_REGION} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Deployed at (UTC) | ${DEPLOYED_AT} |"
            echo ""
            echo "Verify independently: \`curl -I ${FUNCTION_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ env.STAGING_TENANT_ID }}
          path: artifact/deployment-info.json
          if-no-files-found: error

      - name: Commit updated tenant registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/tenants.json
          git diff --cached --quiet || git commit -m "Update staging tenant registry [skip ci]"
          # Push back to the branch the workflow ran from rather than a
          # hardcoded branch name (a hardcoded "main" once silently
          # failed under `|| true` while the default branch was named
          # differently, and registry updates never landed).
          git push origin "HEAD:${GITHUB_REF_NAME}"
