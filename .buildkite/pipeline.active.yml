# Uploaded dynamically by pipeline.yml only when provider=buildkite.
# Configure AWS_REGION and AWS_DEPLOY_ROLE_ARN as Buildkite pipeline
# environment variables. The deploy step requires an agent with Docker.
steps:
  - label: ":test_tube: Test"
    key: test
    command:
      - npm ci
      - npm run typecheck
      - npm run test:unit
      - npm audit --omit=dev --audit-level=high
      - npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - buildkite-agent artifact upload sbom.cdx.json

  - block: ":rocket: Deploy staging"
    key: approve-staging
    depends_on: test
    branches: main
    prompt: "Deploy this main commit to the staging tenant?"

  - label: ":aws: Deploy staging"
    key: deploy-staging
    depends_on: approve-staging
    branches: main
    concurrency: 1
    concurrency_group: dillinger-staging-deploy
    env:
      AWS_REGION: "$$AWS_REGION"
      AWS_DEFAULT_REGION: "$$AWS_REGION"
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: "$$AWS_DEPLOY_ROLE_ARN"
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
    command:
      - pip install aws-sam-cli
      - infra/provision-tenant.sh staging "$$AWS_REGION"
      - |
        set -euo pipefail
        FUNCTION_URL=$(python3 -c "import json; data=json.load(open('infra/tenants.json')); print(next(t['functionUrl'] for t in data['tenants'] if t['tenantId'] == 'staging'))")
        status=$(curl -s -o /dev/null -w "%{http_code}" "$$FUNCTION_URL")
        if [ "$$status" -lt 200 ] || [ "$$status" -ge 400 ]; then
          echo "Smoke test failed: HTTP $$status" >&2
          exit 1
        fi
        mkdir -p artifact
        python3 - "$$FUNCTION_URL" "$$status" > artifact/deployment-info.json <<'PY'
        import json, os, sys
        print(json.dumps({
            "tenantId": "staging",
            "functionUrl": sys.argv[1],
            "region": os.environ["AWS_REGION"],
            "smokeTestHttpStatus": int(sys.argv[2]),
            "commitSha": os.environ.get("BUILDKITE_COMMIT", ""),
            "branch": os.environ.get("BUILDKITE_BRANCH", ""),
        }, indent=2))
        PY
      - buildkite-agent artifact upload artifact/deployment-info.json
      - |
        git config user.name "buildkite[bot]"
        git config user.email "buildkite[bot]@users.noreply.github.com"
        git add infra/tenants.json
        git diff --cached --quiet || git commit -m "Update staging tenant registry [skip ci]"
        git push origin "HEAD:$$BUILDKITE_BRANCH"
