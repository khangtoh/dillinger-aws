AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Dillinger (Next.js) running on AWS Lambda as a container image, behind
  the AWS Lambda Web Adapter, exposed via a public Function URL.

Parameters:
  TenantId:
    Type: String
    Default: default
    AllowedPattern: "[a-z0-9-]+"
    Description: >
      Short slug identifying which single-tenant instance this stack is.
      Each tenant gets their own stack (deploy with
      `--stack-name dillinger-<TenantId>`) and therefore their own
      isolated Lambda function, Function URL, and logs — there is no
      shared state between tenants. One instance is always exactly one
      user.
  NextPublicBaseUrl:
    Type: String
    Default: ""
    Description: >
      Set after the first deploy to the resulting Function URL (or custom
      domain), then redeploy so OAuth callbacks use the correct base URL.
  LogRetentionInDays:
    Type: Number
    Default: 14
  MaxTenantConcurrency:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: Caps concurrent Lambda environments per tenant to bound abuse and cost.
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic ARN for tenant Lambda security and availability alarms.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  DillingerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ..
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      # 2048MB (not 1024): Lambda CPU scales with memory, and the PDF
      # export path launches Chromium in-process - at 1024MB it ran
      # ~13s against the old 15s timeout. See spec/06-execution-pdf-export.md.
      MemorySize: 2048
      Timeout: 30
      ReservedConcurrentExecutions: !Ref MaxTenantConcurrency
      Architectures:
        - x86_64
      Environment:
        Variables:
          NEXT_PUBLIC_BASE_URL: !Ref NextPublicBaseUrl
          PORT: "3000"
          AWS_LWA_PORT: "3000"
          NODE_ENV: production
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Tags:
        Project: dillinger-aws
        TenantId: !Ref TenantId

  DillingerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DillingerFunction}
      RetentionInDays: !Ref LogRetentionInDays

  DillingerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${TenantId} tenant Lambda returned one or more errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DillingerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref "AWS::NoValue"

  DillingerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${TenantId} tenant Lambda is being throttled"
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref DillingerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref "AWS::NoValue"

  DillingerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${TenantId} tenant Lambda p95 duration exceeds 20 seconds"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref DillingerFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 20000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref "AWS::NoValue"

  DillingerConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "${TenantId} tenant Lambda reached its concurrency cap"
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Dimensions:
        - Name: FunctionName
          Value: !Ref DillingerFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref MaxTenantConcurrency
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmTopicArn
        - !Ref "AWS::NoValue"

Outputs:
  TenantId:
    Value: !Ref TenantId
  FunctionUrl:
    Description: Public HTTPS URL Dillinger is served from.
    Value: !GetAtt DillingerFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref DillingerFunction
